<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A full moon seen from under a simulated water surface.">
<title>Fly Me to the Moon</title>
<style>
  /* Layout: one full-bleed WebGL scene; a column of line controls in the lower right, no panel. Single dark look by design. */
  :root {
    --night: #191313;
    --ink: #ffffff;
    --ink-faint: rgba(255, 255, 255, 0.35);
    --font-label: "Times New Roman", Times, "Liberation Serif", serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--ink); overflow: hidden; font-family: var(--font-label); }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #scene.over-moon { cursor: grab; }
  #scene.grabbing { cursor: grabbing; }
  .controls {
    position: fixed; right: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: auto var(--line-w, clamp(110px, 18vw, 170px)); column-gap: 14px; row-gap: 4px; align-items: center;
    font-family: var(--font-label); font-size: 15px; color: var(--ink);
    text-transform: uppercase; letter-spacing: 0.04em; text-shadow: 0 0 6px rgba(0, 0, 0, 0.55);
  }
  .controls.hidden-ui { display: none; }
  /* compressed capitals: Times New Roman has no condensed cut, so the words are narrowed */
  .squeeze { display: inline-block; transform: scaleX(0.72); transform-origin: right center; }
  .controls label { justify-self: end; cursor: pointer; }
  .line { position: relative; height: 22px; }
  .line canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .line input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  .line:focus-within { outline: 1px solid var(--ink-faint); outline-offset: 2px; }
  .buttons { grid-column: 1 / -1; justify-self: end; display: flex; gap: 12px; margin-top: 4px; }
  .presets { grid-column: 1 / -1; justify-self: end; display: flex; gap: 12px; margin-bottom: 6px; }
  .presets button { opacity: 0.6; text-shadow: 0 0 4px rgba(0, 0, 0, 0.85), 0 0 10px rgba(0, 0, 0, 0.5); }
  .presets button[aria-pressed="true"] { opacity: 1; }
  .presets button:hover { opacity: 0.8; }
  .controls button {
    font: inherit; letter-spacing: inherit; text-transform: inherit; text-shadow: inherit; color: var(--ink);
    background: none; border: 0; padding: 2px 0; cursor: pointer;
  }
  .controls button:hover { opacity: 0.7; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--ink-faint); text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Animated 3D scene: a full moon seen from under a simulated water surface. Drag the moon to spin it; tap the water to drop a ripple; press H to hide or show the controls."></canvas>

<div class="controls" id="controls">
  <div class="presets" role="group" aria-label="Sky">
    <button type="button" data-sky="0" aria-pressed="false"><span class="squeeze">Day</span></button>
    <button type="button" data-sky="1" aria-pressed="false"><span class="squeeze">Sunset</span></button>
    <button type="button" data-sky="2" aria-pressed="true"><span class="squeeze">Night</span></button>
    <button type="button" data-sky="3" aria-pressed="false"><span class="squeeze">Midnight</span></button>
    <button type="button" data-sky="4" aria-pressed="false"><span class="squeeze">Eclipse</span></button>
  </div>
  <label for="wind"><span class="squeeze">Wind</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="wind" type="range" min="0" max="1.2" step="0.01" value="0.45"></div>
  <label for="warp"><span class="squeeze">Warp</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="warp" type="range" min="0" max="2" step="0.01" value="1"></div>
  <label for="chop"><span class="squeeze">Waves</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="chop" type="range" min="0" max="1.2" step="0.01" value="0.9"></div>
  <label for="swell"><span class="squeeze">Swell</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="swell" type="range" min="0" max="1.2" step="0.01" value="0.8"></div>
  <label for="speed"><span class="squeeze">Speed</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="speed" type="range" min="0.1" max="1.5" step="0.01" value="0.6"></div>
  <label for="height"><span class="squeeze">Height</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="height" type="range" min="-1" max="1" step="0.01" value="0"></div>
  <label for="halo"><span class="squeeze">Halo</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="halo" type="range" min="0" max="2" step="0.01" value="1"></div>
  <label for="leak"><span class="squeeze">Leak</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="leak" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <label for="murk"><span class="squeeze">Murk</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="murk" type="range" min="0" max="1.5" step="0.01" value="0.7"></div>
  <label for="glow"><span class="squeeze">Glow</span></label><div class="line"><canvas aria-hidden="true"></canvas><input id="glow" type="range" min="0" max="2" step="0.01" value="0.6"></div>
  <div class="buttons">
    <button id="moonpos" type="button" aria-pressed="false" aria-label="Moon in front of or behind the water"><span class="squeeze">In front</span></button>
    <button id="bloom" type="button" aria-pressed="true"><span class="squeeze">Bloom on</span></button>
    <button id="pause" type="button"><span class="squeeze">Pause</span></button>
  </div>
</div>

<div class="err" id="err" hidden>This scene needs WebGL 2, which isn't available in this browser.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('scene');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  } catch (e) { renderer = null; }
  if (!renderer || !renderer.capabilities.isWebGL2) {
    document.getElementById('err').hidden = false;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.autoClear = false;
  const CLEAR = new THREE.Color(0x191313);
  renderer.setClearColor(CLEAR, 1);

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduceMotion ? 0.35 : 1;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.position.set(0, 0, 14);
  const flatCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const flatVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const quad = mat => new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);

  const uniforms = {
    uTime: { value: 0 },
    uRes: { value: new THREE.Vector2(1, 1) },
    uMoon: { value: new THREE.Vector2(0, 0) },   // the scene's anchor: where the moon sits in the water, device pixels (bottom-left origin)
    uMoonR: { value: 100 },                      // the moon's radius there, device pixels (the scene's unit)
    uMoonC: { value: new THREE.Vector2(0, 0) },  // where the moon actually is right now
    uMoonRC: { value: 100 },                     // and its actual radius
    uAbove: { value: 0 },                        // 0: moon in the water, 1: moon in the sky above it
    uLeak: { value: 0.5 },                       // light leaking, scrambled, into the dark water
    uMurk: { value: 0.7 },                       // how cloudy the water is: light scattered out of the bright window
    uMoonTex: { value: null },                   // the moon rendered off-screen, for viewing through the surface
    uSim: { value: null },                       // simulated height field
    uSwell: { value: 0.8 },
    uChop: { value: 0.9 },
    uWarp: { value: 1 },
    uChopMode: { value: 1 },                      // 0: isotropic chop, 1: broad directional wind sea
    uLimit: { value: 0.18 },                      // soft cap on surface tilt (0 = off)
    uScale: { value: 1 },
    // palette, set by the Sky control (see SKIES below)
    uDeepL: { value: new THREE.Vector3() }, uDeepR: { value: new THREE.Vector3() }, uUpLight: { value: new THREE.Vector3() },
    uSkyLow: { value: new THREE.Vector3() }, uSkyHigh: { value: new THREE.Vector3() },
    uGlowA: { value: new THREE.Vector3() }, uGlowB: { value: new THREE.Vector3() },
    uHalo: { value: new THREE.Vector3() }, uHaloGain: { value: 1 }, uImage: { value: new THREE.Vector3() }, uBloomTint: { value: new THREE.Vector3() },
  };

  // =====================================================================================
  // 1. Water surface simulation
  // A 512x512 height field on the GPU (20 x 20 units, much wider than the patch of surface in view), stepped with the discrete wave equation: each cell is pulled
  // toward the average of its neighbours, so ripples travel, spread, interfere and slowly die away.
  // The grid wraps around, so the surface tiles without seams. Wind is a slowly drifting random
  // pressure on the surface; taps drop a ripple where they land.
  // =====================================================================================
  const SIM = 512;
  const simOpts = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, depthBuffer: false,
                    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
                    wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping };
  const simRT = [new THREE.WebGLRenderTarget(SIM, SIM, simOpts), new THREE.WebGLRenderTarget(SIM, SIM, simOpts)];
  let simCur = 0;
  const simMat = new THREE.ShaderMaterial({
    uniforms: { tPrev: { value: null }, uTime: { value: 0 }, uWind: { value: 0.45 }, uDrop: { value: new THREE.Vector4(0, 0, 0, 0) } },
    depthTest: false, depthWrite: false,
    vertexShader: flatVS,
    fragmentShader: `
      uniform sampler2D tPrev; uniform float uTime, uWind; uniform vec4 uDrop; varying vec2 vUv;
      const float N = ${SIM.toFixed(1)};
      // value noise that repeats every 'per' cells, so the wind tiles with the grid
      float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
      float pnoise(vec2 p, float per){
        vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        vec2 a = mod(i, per), b = mod(i + 1.0, per);
        return mix(mix(h21(a), h21(vec2(b.x, a.y)), f.x), mix(h21(vec2(a.x, b.y)), h21(b), f.x), f.y);
      }
      const float GUST_STEPS = 6.0;
      // one wind pattern: six plane waves of pressure in random directions and lengths
      // (whole numbers of cycles per tile, so it wraps seamlessly)
      float gustPattern(float id){
        float g = 0.0;
        for (int i = 0; i < 6; i++) {
          vec3 h = fract(sin(vec3(id*1.37 + float(i)*17.1, id*0.71 + float(i)*5.3, id*2.11 + float(i)*9.7))
                         * vec3(43758.5453, 22578.1459, 19642.3490));
          float ang = h.x*6.2831, mag = mix(28.0, 75.0, h.y);
          vec2 k = floor(vec2(cos(ang), sin(ang))*mag + 0.5);
          g += cos(6.2831*dot(k, vUv) + h.z*6.2831);
        }
        return g;
      }
      void main(){
        vec4 info = texture2D(tPrev, vUv);
        vec2 dx = vec2(1.0/N, 0.0), dy = vec2(0.0, 1.0/N);
        vec4 nb = (texture2D(tPrev, vUv - dx) + texture2D(tPrev, vUv + dx) +
                   texture2D(tPrev, vUv - dy) + texture2D(tPrev, vUv + dy)) * 0.25;
        // wave equation: accelerate toward the neighbours. A coupling of 1.8 (not the 2.0 limit)
        // keeps every mode stable, including the grid-scale one.
        info.g += (nb.r - info.r) * 1.8;
        info.g -= info.r * 0.003;                  // restoring pull toward level, so long waves can't drift
        info.g *= 0.99;                            // damping: a tap's ripples fade over a couple of seconds
        info.g = mix(info.g, nb.g, 0.15);          // viscosity on the motion: damps grid-scale ringing
        // wind: every step, six plane waves of pressure in random directions and lengths (whole
        // numbers of cycles per tile, so it still wraps seamlessly). No lattice, no preferred axis:
        // over many steps it adds up to gusts that are the same in every direction, and because it
        // changes faster than the waves can follow, the wave equation turns it into a steady chop.
        // Each pattern lasts a few steps and blends smoothly into the next, so the wind sets off
        // slower, longer ripples instead of a stream of twitchy short-lived ones.
        float T = uTime*120.0/GUST_STEPS;
        float gust = mix(gustPattern(floor(T)), gustPattern(floor(T) + 1.0), smoothstep(0.0, 1.0, fract(T)));
        info.g += gust * 0.00008 * uWind;
        info.r += info.g;
        // a tap: a smooth dent that springs back and rings outward
        if (uDrop.z > 0.0) {
          vec2 d = vUv - uDrop.xy; d -= floor(d + 0.5);          // shortest way round the wrapped grid
          float r = length(d) / uDrop.w;
          if (r < 1.0) info.r -= uDrop.z * (0.5 + 0.5*cos(r*3.14159));
        }
        gl_FragColor = info;
      }`
  });
  const simScene = new THREE.Scene(); simScene.add(quad(simMat));
  const NO_DROP = new THREE.Vector4(0, 0, 0, 0);
  const drops = [];
  function simStep() {
    simMat.uniforms.tPrev.value = simRT[simCur].texture;
    simMat.uniforms.uDrop.value.copy(drops.length ? drops.shift() : NO_DROP);
    renderer.setRenderTarget(simRT[1 - simCur]); renderer.render(simScene, flatCam);
    simCur = 1 - simCur;
  }
  // start flat
  renderer.setClearColor(0x000000, 0);
  for (const rt of simRT) { renderer.setRenderTarget(rt); renderer.clear(); }
  renderer.setRenderTarget(null);
  renderer.setClearColor(CLEAR, 1);

  // =====================================================================================
  // 2. Looking up through it
  // For each pixel, a ray leaves an underwater camera (3 units deep, tilted 37 degrees up) and hits
  // the surface. The surface normal there comes from the simulation plus a few long swells that
  // obey the deep-water dispersion relation (omega^2 = g k: longer waves travel faster). The ray is
  // bent out through the surface with Snell's law (n = 1.333) and weighted by Fresnel; past the
  // critical angle it reflects back down into the dark water instead. In the sky above sits a moon;
  // its broken image in the surface, and every glint around it, is wherever a ray bends onto it.
  // =====================================================================================
  const CAM = { FS: 0.25, ALPHA: 0.648, DEPTH: 3.0, TILE: 20.0 };
  const WATER = `
      uniform float uHaloGain, uMoonRC, uAbove, uLeak, uMurk;
      uniform vec2 uMoonC;
      uniform sampler2D uMoonTex;
      vec3 gN = vec3(0.0, 1.0, 0.0); float gT = 0.0;   // surface normal and transmission at the last lookUp
      vec2 gLeakOff = vec2(0.0); float gLeakW = 0.0;   // where (and how much) the moon leaks into the dark water
      uniform vec3 uDeepL, uDeepR, uUpLight, uSkyLow, uSkyHigh, uGlowA, uGlowB, uHalo, uImage, uBloomTint;
      uniform sampler2D uSim; uniform float uTime, uSwell, uChop, uWarp, uChopMode, uLimit, uScale; uniform vec2 uMoon; uniform float uMoonR;
      const float FS = ${CAM.FS}, ALPHA = ${CAM.ALPHA}, DEPTH = ${CAM.DEPTH.toFixed(1)}, TILE = ${CAM.TILE.toFixed(1)};
      const float SIM_N = ${SIM.toFixed(1)};
      // the moon in the sky: elevation ~35 degrees straight ahead, drawn large (stylised), plus its glow
      const vec3 SKY_MOON = vec3(0.0, 0.574, 0.819);
      const float MOON_COS = 0.995;        // angular radius ~5.7 degrees
      vec2 screenPos(){ vec2 s = (gl_FragCoord.xy/uScale - uMoon) / uMoonR; return vec2(s.x, -s.y); }
      vec3 viewRay(vec2 s){
        vec3 d = normalize(vec3(s.x*FS, -s.y*FS, 1.0));
        float ca = cos(ALPHA), sa = sin(ALPHA);
        return vec3(d.x, d.y*ca + d.z*sa, -d.y*sa + d.z*ca);
      }
      // one long swell: x height, yz slope
      vec3 swell(vec2 x, float ang, float lambda, float steep, float ph){
        float k = 6.2831/lambda;
        vec2 kv = k*vec2(cos(ang), sin(ang));
        float w = sqrt(9.81*k)*0.45;                       // dispersion (time slowed for a calm night)
        float a = steep/k;
        float th = dot(kv, x) - w*uTime + ph;
        return vec3(a*sin(th), a*cos(th)*kv);
      }
      float h11(float n){ return fract(sin(n*12.9898 + 4.1414)*43758.5453); }
      // Wind waves. Mode 0: twelve short waves spread evenly over every direction (the old chop;
      // they interfere into a faint repeating pattern). Mode 1: a wind sea, waves travelling within
      // about +-30 degrees of one wind direction with irregular lengths and phases: ten broad waves
      // (0.8-3.2 units) whose long crests roll across the water, plus six short ones for sparkle.
      vec3 chop(vec2 x, float dist){
        vec2 g = vec2(0.0); float curv = 0.0;
        if (uChopMode < 0.5) {
          float lambda = 0.62;
          for (int i = 0; i < 12; i++) {
            float fi = float(i);
            float ang = 0.35 + fi*2.39996;
            float k = 6.2831/lambda;
            vec2 kv = k*vec2(cos(ang), sin(ang)*0.8);
            float w = sqrt(9.81*k)*0.45;
            float th = dot(kv, x) - w*uTime + fi*1.7;
            g += 0.05*cos(th)*kv/k;
            lambda *= 0.86;
          }
          return vec3(g / (1.0 + dist*0.18), 0.0);
        }
        for (int i = 0; i < 16; i++) {
          float fi = float(i);
          float broad = i < 10 ? 1.0 : 0.0;
          float ang = 1.5708 + (h11(fi) - 0.5)*1.05;                 // around the wind, heading away from us
          float lambda = broad > 0.5 ? mix(0.8, 3.2, h11(fi + 20.0)) : mix(0.25, 0.6, h11(fi + 20.0));
          float steep = broad > 0.5 ? 0.028*(0.6 + 0.8*h11(fi + 40.0)) : 0.016*(0.6 + 0.8*h11(fi + 40.0));
          float k = 6.2831/lambda;
          vec2 kv = k*vec2(cos(ang), sin(ang));
          float w = sqrt(9.81*k)*0.45;
          float th = dot(kv, x) - w*uTime + h11(fi + 60.0)*6.2831;
          // short waves fade with distance faster than broad ones
          float fadeW = 1.0 / (1.0 + dist*(broad > 0.5 ? 0.05 : 0.2));
          g += steep*cos(th)*kv/k * fadeW;
          curv -= steep*k*sin(th) * fadeW * (broad > 0.5 ? 1.0 : 0.25);   // crests vs troughs, mostly the broad waves
        }
        return vec3(g, curv);
      }
      // surface slope at a point: simulation + swells + chop. dist fades ripples too fine to resolve far away.
      // Smooth cubic B-spline read of the height grid (four linear reads). Unlike plain linear
      // blending, its slopes change smoothly across cells, so the grid never shows in the light.
      vec4 bsw(float v){
        vec4 n = vec4(1.0, 2.0, 3.0, 4.0) - v; vec4 c = n*n*n;
        float x = c.x, y = c.y - 4.0*c.x, z = c.z - 4.0*c.y + 6.0*c.x;
        return vec4(x, y, z, 6.0 - x - y - z) / 6.0;
      }
      float heightAt(vec2 uv){
        uv = uv*SIM_N - 0.5;
        vec2 f = fract(uv); uv -= f;
        vec4 xc = bsw(f.x), yc = bsw(f.y);
        vec4 c = uv.xxyy + vec2(-0.5, 1.5).xyxy;
        vec4 sm = vec4(xc.xz + xc.yw, yc.xz + yc.yw);
        vec4 o = (c + vec4(xc.yw, yc.yw)/sm) / SIM_N;
        float s0 = texture2D(uSim, o.xz).r, s1 = texture2D(uSim, o.yz).r;
        float s2 = texture2D(uSim, o.xw).r, s3 = texture2D(uSim, o.yw).r;
        float sx = sm.x/(sm.x + sm.y), sy = sm.z/(sm.z + sm.w);
        return mix(mix(s3, s2, sx), mix(s1, s0, sx), sy);
      }
      // A non-uniform lattice: the surface coordinates are bent by a slow, smooth warp before the
      // height grid is read, then turned 27 degrees, so the grid is stretched and curved differently
      // everywhere and never lines up with the screen. (The same warp lives in surfaceUV() in JS.)
      const float ROT_C = 0.8916, ROT_S = 0.4529;
      vec2 warpXZ(vec2 x){
        vec2 w = 0.35*vec2(sin(dot(x, vec2(0.61, 0.23)) + uTime*0.11 + 1.3), cos(dot(x, vec2(-0.19, 0.57)) - uTime*0.09))
               + 0.18*vec2(sin(dot(x, vec2(-0.93, 1.21)) - uTime*0.17 + 4.1), sin(dot(x, vec2(1.37, 0.41)) + uTime*0.13 + 2.2))
               + 0.09*vec2(cos(dot(x, vec2(2.3, -1.7)) + uTime*0.23), sin(dot(x, vec2(1.1, 2.6)) - uTime*0.21 + 0.7));
        return x + w*uWarp;
      }
      vec3 surfaceSlope(vec2 xz, float dist){
        vec2 wx = warpXZ(xz);
        vec2 uv = vec2(ROT_C*wx.x - ROT_S*wx.y, ROT_S*wx.x + ROT_C*wx.y) / TILE;
        float e = 1.5/SIM_N;
        float hc = heightAt(uv);
        float hl = heightAt(uv - vec2(e, 0.0)), hr = heightAt(uv + vec2(e, 0.0));
        float hd = heightAt(uv - vec2(0.0, e)), hu = heightAt(uv + vec2(0.0, e));
        float fade = 1.0 / (1.0 + dist*0.1);
        const float ROUGH = 2.0;                           // how tall the simulated ripples are
        vec2 gs = vec2(hr - hl, hu - hd) / (2.0*e*TILE) * fade * ROUGH;
        vec2 g = vec2(ROT_C*gs.x + ROT_S*gs.y, -ROT_S*gs.x + ROT_C*gs.y);   // back out of the turned grid
        float lap = (hl + hr + hu + hd - 4.0*hc) * fade * ROUGH;   // curvature: crests vs troughs
        vec3 sw = swell(xz, 0.35, 7.0, 0.015, 0.0) + swell(xz, -0.6, 4.3, 0.02, 1.7)
                + swell(xz, 1.25, 2.6, 0.026, 4.1) + swell(xz, 2.3, 1.6, 0.024, 2.2);
        vec3 ch = chop(wx, dist) * uChop;                  // the waves ride the same warp
        g += sw.yz * uSwell + ch.xy;
        // Soft limit on the total tilt: gentle slopes pass unchanged, steep ones are compressed
        // smoothly toward uLimit, so no combination of settings can throw the surface into extremes.
        if (uLimit > 0.0) {
          float m = length(g);
          float e2 = exp(-2.0*m/uLimit);
          g *= m > 1e-5 ? uLimit*(1.0 - e2)/(1.0 + e2)/m : 1.0;
        }
        return vec3(g, ch.z);                              // curvature of the broad waves, for the light bands
      }
      // x,y,z: colour of the water seen along this pixel, w: brightness of the moon's image here
      float vnoise(vec2 p){
        vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);

    canvas.classList.toggle('over-moon', onMoon(e));
    if (stirring) {
      if (Math.hypot(e.clientX - last.x, e.clientY - last.y) > 10) { dropAt(s[0], s[1], 0.01); last = { x: e.clientX, y: e.clientY, t: performance.now() }; }
      return;
    }
    if (!grabbing) return;
    const now = performance.now();
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    const dt = Math.max((now - last.t) / 1000, 1 / 240);
    const dist = Math.hypot(dx, dy);
    if (dist > 0) {
      const rCss = uniforms.uMoonRC.value / renderer.getPixelRatio();
      const angle = dist / rCss;
      const axis = screenAxis(dx, dy).clone();
      rotateBy(axis, angle);
      omega.lerp(axis.multiplyScalar(angle / dt), 0.5);
      lastMoveAt = now;
    }
    last = { x: e.clientX, y: e.clientY, t: now };
  });
  function release() {
    stirring = false;
    if (!grabbing) return;
    grabbing = false; canvas.classList.remove('grabbing');
    if (performance.now() - lastMoveAt > 90) omega.set(0, 0, 0);
    if (omega.length() > MAX_SPIN) omega.setLength(MAX_SPIN);
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('keydown', e => {
    const k = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    if (k) { e.preventDefault(); touched = true; omega.add(screenAxis(k[1], k[0]).clone().multiplyScalar(0.8)); }
    else if (e.key === ' ') { e.preventDefault(); omega.set(0, 0, 0); }
  });

  document.getElementById('wind').addEventListener('input', e => simMat.uniforms.uWind.value = parseFloat(e.target.value));
  document.getElementById('warp').addEventListener('input', e => uniforms.uWarp.value = parseFloat(e.target.value));
  document.getElementById('chop').addEventListener('input', e => uniforms.uChop.value = parseFloat(e.target.value));
  document.getElementById('swell').addEventListener('input', e => uniforms.uSwell.value = parseFloat(e.target.value));
  document.getElementById('speed').addEventListener('input', e => waveSpeed = parseFloat(e.target.value));
  document.getElementById('height').addEventListener('input', e => moonHeight = parseFloat(e.target.value));
  document.getElementById('murk').addEventListener('input', e => uniforms.uMurk.value = parseFloat(e.target.value));
  document.getElementById('leak').addEventListener('input', e => uniforms.uLeak.value = parseFloat(e.target.value));
  document.getElementById('halo').addEventListener('input', e => uniforms.uHaloGain.value = parseFloat(e.target.value));
  document.getElementById('glow').addEventListener('input', e => glowU.value = parseFloat(e.target.value));
  let bloomOn = true;
  const moonBtn = document.getElementById('moonpos');
  moonBtn.addEventListener('click', () => {
    aboveTo = aboveTo ? 0 : 1;
    moonBtn.firstElementChild.textContent = aboveTo ? 'Behind' : 'In front';
    moonBtn.setAttribute('aria-pressed', String(!!aboveTo));
    tightenRows();
  });
  const bloomBtn = document.getElementById('bloom');
  bloomBtn.addEventListener('click', () => {
    bloomOn = !bloomOn;
    bloomBtn.firstElementChild.textContent = bloomOn ? 'Bloom on' : 'Bloom off';
    if (typeof tightenRows === 'function') tightenRows();
    bloomBtn.setAttribute('aria-pressed', String(bloomOn));
  });
  let paused = false;
  const pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.firstElementChild.textContent = paused ? 'Play' : 'Pause'; tightenRows(); });

  const rtMoon = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  uniforms.uMoonTex.value = rtMoon.texture;
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.position.z = w / h < 1 ? 14 / Math.max(w / h, 0.5) * 0.85 : 14;
    camera.updateProjectionMatrix();
    const pr = renderer.getPixelRatio();
    uniforms.uRes.value.set(w * pr, h * pr);
    rtA.setSize(Math.max(1, Math.round(w * pr / 4)), Math.max(1, Math.round(h * pr / 4)));
    rtB.setSize(rtA.width, rtA.height);
    rtMoon.setSize(Math.round(w * pr), Math.round(h * pr));
  }
  window.addEventListener('resize', resize);
  resize();

  const centre = new THREE.Vector3();
  // The water is laid out around a fixed anchor (where the moon sits in the water), so it stays put
  // when the moon moves up into the sky; the halo and the pointer follow the moon itself.
  const ANCHOR = new THREE.Vector3(0, -0.5, 0);
  function project(point, radius, outPos) {
    const dist = point.distanceTo(camera.position);
    const p = point.clone().project(camera);
    const res = uniforms.uRes.value;
    outPos.set((p.x * 0.5 + 0.5) * res.x, (p.y * 0.5 + 0.5) * res.y);
    const focal = (res.y / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    return focal * radius / Math.sqrt(Math.max(dist * dist - radius * radius, 1e-3));
  }
  function updateMoonScreen() {
    uniforms.uMoonR.value = project(ANCHOR, MOON_R, uniforms.uMoon.value);
    moonGroup.getWorldPosition(centre);
    uniforms.uMoonRC.value = project(centre, MOON_R * moonGroup.scale.x, uniforms.uMoonC.value);
  }

  const clock = new THREE.Clock();
  let t = 0, wt = 0, simBudget = 0, aboveT = 0, aboveTo = 0, moonHeight = 0;
  let waveSpeed = 0.6;
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused) {
      t += dt * speed;
      // the water runs on its own clock, scaled by the Speed control: swells, waves, warp drift and
      // the simulation all slow together (fewer simulation steps per second, so ripples travel slower)
      const ws = speed * waveSpeed;
      wt += dt * ws;
      simMat.uniforms.uTime.value = wt;
      simBudget = Math.min(simBudget + dt * 120 * ws, 4);
      while (simBudget >= 1) { simStep(); simBudget -= 1; }
    }
    uniforms.uTime.value = wt;
    uniforms.uSim.value = simRT[simCur].texture;

    if (!grabbing && !paused) {
      const w = omega.length();
      if (w > 1e-5) rotateBy(tmpV.copy(omega).divideScalar(w), w * dt);
      if (touched) omega.multiplyScalar(Math.exp(-FRICTION * dt));
    }
    const drift = reduceMotion ? 0 : 1;
    camera.position.x = Math.sin(t * 0.2) * 0.25 * drift;
    camera.position.y = Math.sin(t * 0.15) * 0.15 * drift;
    camera.lookAt(0, 0.2, 0);
    // into the sky: up into the bright window and smaller, as if far above
    if (aboveT !== aboveTo) aboveT = reduceMotion ? aboveTo : Math.max(0, Math.min(1, aboveT + Math.sign(aboveTo - aboveT) * dt/1.4));
    const up = aboveT*aboveT*(3 - 2*aboveT);
    uniforms.uAbove.value = up;
    moonGroup.position.y = -0.5 + 3.34*up + moonHeight*2.4 + Math.sin(t * 0.3) * 0.05;
    moonGroup.scale.setScalar(1 - 0.38*up);
    updateMoonScreen();

    if (bloomOn) renderBloom();
    renderer.setRenderTarget(null);
    renderer.clear();
    if (up > 0.001) {                           // the moon off-screen, to be seen through the surface
      moonUniforms.uMoonFade.value = 1;
      renderer.setClearColor(0x000000, 0);
      renderer.setRenderTarget(rtMoon); renderer.clear(); renderer.render(scene, camera);
      renderer.setRenderTarget(null); renderer.setClearColor(CLEAR, 1);
      renderer.clear();
    }
    renderer.render(bgScene, flatCam);
    moonUniforms.uMoonFade.value = 1 - up;
    if (up < 0.999) renderer.render(scene, camera);
    renderer.render(glintScene, flatCam);       // the moon's image, in front of the big moon
    if (bloomOn) renderer.render(bloomScene, flatCam);
    renderer.render(overlayScene, flatCam);
    stepSky(dt);
    drawSliders(reduceMotion ? 0 : performance.now()/1000);
    requestAnimationFrame(frame);
  }
  // ---------------------------------------------------------------------------------------
  // Line controls: a solid white line up to the value, blending quickly into a faint line
  // that barely wobbles.
  // The real range inputs sit invisibly on top, so dragging, keyboard and screen readers all work.
  // ---------------------------------------------------------------------------------------
  const lineSliders = [...document.querySelectorAll('.line')].map((el, i) => ({
    input: el.querySelector('input'), canvas: el.querySelector('canvas'), seed: i*7.31 }));
  function drawSliders(time) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const sl of lineSliders) {
      const c = sl.canvas, w = c.clientWidth, h = c.clientHeight;
      if (!w) continue;
      if (c.width !== Math.round(w*dpr) || c.height !== Math.round(h*dpr)) { c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); }
      const g = c.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
      const inp = sl.input, min = +inp.min, max = +inp.max;
      const x = (inp.value - min) / (max - min) * w, y = Math.round(h/2) + 0.5;
      // One filled ribbon per line, so nothing overlaps: its centre wobbles very gently past the value, and a single gradient takes it from solid white
      // into faint grey over a few pixels around the value.
      const top = [], bot = [];
      for (let px = 0; px <= w + 0.01; px += 1) {
        const d = px - x;
        const t = Math.min(1, Math.max(0, (d + 4) / 8)), s = t*t*(3 - 2*t);
        const half = (1.5 - 0.5*s) / 2;
        const ease = Math.min(1, Math.max(0, d)/16);
        const cy = y + (Math.sin(px*0.35 + time*7 + sl.seed)*0.35 + Math.sin(px*0.13 - time*4.3 + sl.seed*2.0)*0.25) * ease;
        top.push(px, cy - half); bot.push(px, cy + half);
      }
      const gr = g.createLinearGradient(0, 0, w, 0);
      const a = Math.min(1, Math.max(0, (x - 4)/w)), b = Math.min(1, Math.max(a, (x + 4)/w));
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(a, '#ffffff');
      gr.addColorStop(b, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(255,255,255,0.35)');
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(top[0], top[1]);
      for (let i = 2; i < top.length; i += 2) g.lineTo(top[i], top[i+1]);
      for (let i = bot.length - 2; i >= 0; i -= 2) g.lineTo(bot[i], bot[i+1]);
      g.closePath(); g.fill();
    }
  }

  // ---------------------------------------------------------------------------------------
  // Sky: one palette per time of day. The control slides through them in order and blends
  // every colour between the two nearest, so it shifts smoothly from one look to the next.
  // ---------------------------------------------------------------------------------------
  const SKIES = [
    { name: 'Day',
      deepL: [0.09,0.19,0.25], deepR: [0.10,0.21,0.29], upLight: [0.05,0.13,0.16],
      skyLow: [0.50,0.70,0.88], skyHigh: [0.28,0.52,0.85], glowA: [0.10,0.10,0.08], glowB: [0.18,0.18,0.15],
      halo: [0.04,0.075,0.085], image: [1.0,1.0,1.0], bloom: [0.85,0.92,1.0],
      moonMul: [1,1,1], moonMix: [0.97,0.98,1.0,0.55], moonDark: [0.20,0.30,0.36], moonSee: 0, relief: 0 },
    { name: 'Sunset',
      deepL: [0.14,0.07,0.05], deepR: [0.10,0.06,0.08], upLight: [0.10,0.05,0.02],
      skyLow: [0.92,0.45,0.18], skyHigh: [0.40,0.24,0.36], glowA: [0.30,0.16,0.06], glowB: [0.40,0.28,0.14],
      halo: [0.30,0.16,0.10], image: [1.0,0.86,0.62], bloom: [1.0,0.72,0.45],
      moonMul: [1.2,0.9,0.72], moonMix: [0.98,0.78,0.58,0.45], moonDark: [0.14,0.06,0.05], moonSee: 0, relief: 0.25 },
    { name: 'Night',
      deepL: [0.098,0.075,0.075], deepR: [0.102,0.098,0.133], upLight: [0.0,0.03,0.06],
      skyLow: [0.07,0.13,0.22], skyHigh: [0.13,0.25,0.40], glowA: [0.16,0.28,0.38], glowB: [0.25,0.35,0.45],
      halo: [0.118,0.239,0.282], image: [0.95,0.97,1.0], bloom: [0.8,0.87,0.95],
      moonMul: [1,1,1], moonMix: [1,1,1,0], moonDark: [0.03,0.08,0.11], moonSee: 0, relief: 0 },
    { name: 'Midnight',
      deepL: [0.025,0.02,0.025], deepR: [0.025,0.028,0.04], upLight: [0.0,0.012,0.025],
      skyLow: [0.02,0.035,0.06], skyHigh: [0.035,0.07,0.13], glowA: [0.08,0.13,0.19], glowB: [0.15,0.2,0.27],
      halo: [0.05,0.10,0.12], image: [0.9,0.94,1.0], bloom: [0.55,0.65,0.8],
      moonMul: [0.78,0.82,0.88], moonMix: [0,0,0,0], moonDark: [0.01,0.03,0.045], moonSee: 0, relief: 0 },
    { name: 'Eclipse',
      deepL: [0.045,0.018,0.018], deepR: [0.04,0.02,0.026], upLight: [0.03,0.004,0.0],
      skyLow: [0.04,0.025,0.03], skyHigh: [0.05,0.03,0.05], glowA: [0.22,0.06,0.03], glowB: [0.32,0.10,0.05],
      halo: [0.26,0.06,0.03], image: [0.98,0.50,0.28], bloom: [0.85,0.32,0.14],
      moonMul: [1.30,0.48,0.32], moonMix: [0,0,0,0], moonDark: [0.05,0.01,0.01], moonSee: 0, relief: 0.35 },
  ];
  let skyValue = 2, skyFrom = 2, skyTo = 2, skyT = 1;
  const presetBtns = [...document.querySelectorAll('.presets button')];
  function applySky(v) {
    v = Math.min(SKIES.length - 1, Math.max(0, v));
    const i = Math.min(SKIES.length - 2, Math.floor(v)), f = v - i, A = SKIES[i], B = SKIES[i + 1];
    const mixv = k => A[k].map((a, n) => a + (B[k][n] - a)*f);
    const mixs = k => A[k] + (B[k] - A[k])*f;
    const set = (u, k) => u.value.fromArray(mixv(k));
    set(uniforms.uDeepL, 'deepL'); set(uniforms.uDeepR, 'deepR'); set(uniforms.uUpLight, 'upLight');
    set(uniforms.uSkyLow, 'skyLow'); set(uniforms.uSkyHigh, 'skyHigh');
    set(uniforms.uGlowA, 'glowA'); set(uniforms.uGlowB, 'glowB');
    set(uniforms.uHalo, 'halo'); set(uniforms.uImage, 'image'); set(uniforms.uBloomTint, 'bloom');
    set(moonUniforms.uMoonMul, 'moonMul'); set(moonUniforms.uMoonMix, 'moonMix'); set(moonUniforms.uMoonDark, 'moonDark');
    moonUniforms.uMoonSee.value = mixs('moonSee'); moonUniforms.uRelief.value = mixs('relief');
    const d = mixv('deepL');
    CLEAR.setRGB(d[0], d[1], d[2]); renderer.setClearColor(CLEAR, 1);
    document.body.style.background = '#' + CLEAR.getHexString();
    skyValue = v;
  }
  // pressing a preset fades the whole palette there over about a second
  function goToSky(target, instant) {
    presetBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.sky === Math.round(target))));
    if (instant || reduceMotion) { skyT = 1; skyTo = target; applySky(target); return; }
    skyFrom = skyValue; skyTo = target; skyT = 0;
  }
  function stepSky(dt) {
    if (skyT >= 1) return;
    skyT = Math.min(1, skyT + dt/1.1);
    const e = skyT*skyT*(3 - 2*skyT);
    applySky(skyFrom + (skyTo - skyFrom)*e);
  }
  presetBtns.forEach(b => b.addEventListener('click', () => goToSky(+b.dataset.sky)));
  // narrowed words keep their full layout width; pull each one in so a row of them sits evenly
  function tightenRows() {
    document.querySelectorAll('.presets .squeeze, .buttons .squeeze').forEach(el => {
      el.style.marginLeft = '0px';
      el.style.marginLeft = `${-(1 - 0.72) * el.offsetWidth}px`;
    });
  }
  tightenRows();
  // the lines reach left to sit under the first preset (DAY)
  function alignLines() {
    const controls = document.getElementById('controls');
    const first = document.querySelector('.presets .squeeze');
    const line = document.querySelector('.line');
    if (!first || !line) return;
    const w = Math.round(line.getBoundingClientRect().right - first.getBoundingClientRect().left);
    if (w > 60) controls.style.setProperty('--line-w', w + 'px');
  }
  alignLines();
  window.addEventListener('resize', () => { document.getElementById('controls').style.removeProperty('--line-w'); alignLines(); });
  applySky(2);

  // Settings from the address, e.g. ?sky=sunset&waves=1.2&swell=1.2&speed=0.3&bloom=0&turn=90&ui=0
  const q = new URLSearchParams(location.search);
  for (const [key, id] of [['wind','wind'], ['warp','warp'], ['waves','chop'], ['swell','swell'], ['speed','speed'], ['height','height'], ['halo','halo'], ['leak','leak'], ['murk','murk'], ['glow','glow']]) {
    if (q.has(key)) { const el = document.getElementById(id); el.value = q.get(key); el.dispatchEvent(new Event('input')); }
  }
  if (q.has('sky')) {
    const v = q.get('sky'), named = SKIES.findIndex(k => k.name.toLowerCase() === v.toLowerCase());
    goToSky(named >= 0 ? named : Math.min(4, Math.max(0, parseFloat(v) || 0)), true);
  }
  if (q.get('bloom') === '0') bloomBtn.click();
  if (/^(behind|above|sky)$/.test(q.get('moon') || '')) { moonBtn.click(); aboveT = 1; }
  if (q.has('turn')) rotateBy(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(parseFloat(q.get('turn')) || 0));
  if (q.get('ui') === '0') document.getElementById('controls').classList.add('hidden-ui');

  // H hides and shows the controls
  window.addEventListener('keydown', e => {
    if (e.key !== 'h' && e.key !== 'H') return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    const controls = document.getElementById('controls');
    const hiding = !controls.classList.contains('hidden-ui');
    if (hiding && controls.contains(document.activeElement)) canvas.focus();
    controls.classList.toggle('hidden-ui', hiding);
  });

  frame();
})();
</script>
</body>
</html>
